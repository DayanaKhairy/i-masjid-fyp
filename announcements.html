<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Live Announcements | i@masjid</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">

  <style>
    body {
      background: var(--bg-app);
      color: var(--text-main);
      font-family: 'Poppins', 'Inter', sans-serif;
      padding-bottom: 5rem;
    }
    .page-header {
      background: #FFFFFF;
      border-bottom: 1px solid #EFEFEF;
      padding: 2.5rem 1.5rem 2rem;
      text-align: center;
      position: relative;
    }
    .btn-back {
      position: absolute;
      top: 1.5rem; left: 1.5rem;
      background: #F8F9FA;
      border: 1px solid #E0E0E0;
      width: 40px; height: 40px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-main); text-decoration: none;
      transition: all 0.3s ease;
      z-index: 10;
    }
    .btn-back:hover { background: var(--primary-gold); color: var(--text-main); }
    
    .page-header i {
      font-size: 2.5rem; color: var(--primary-gold); margin-bottom: 1rem;
    }
    .page-header h1 { font-size: 2rem; margin-bottom: 0.5rem; color: var(--text-main); font-weight: 700; }
    .page-header p { color: var(--text-muted); }

    .announcements-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    /* Admin Action Bar */
    #admin-action-bar {
      display: none; /* hidden by default */
      text-align: right;
      padding: 0 1.5rem;
      max-width: 800px;
      margin: 1rem auto 0 auto;
    }
    .btn-add {
      background: var(--color-primary);
      color: var(--color-bg-dark);
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .a-card {
      background: var(--color-card-dark);
      border: 1px solid var(--color-card-border);
      border-radius: 12px;
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
    }
    .a-card.pinned {
      border-color: rgba(255, 255, 255, 0.5);
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, transparent 100%);
    }
    .a-card.pinned::before {
      content: '';
      position: absolute; top: 0; left: 0;
      width: 4px; height: 100%;
      background: #ffffff;
    }
    
    .a-header {
      display: flex; justify-content: space-between; align-items: flex-start;
      margin-bottom: 0.8rem;
    }
    .a-title {
      font-size: 1.2rem; font-weight: 700; margin: 0;
      display: flex; align-items: center; gap: 0.5rem;
    }
    .a-date {
      font-size: 0.85rem; color: var(--color-text-muted);
    }
    .badge-pinned {
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      font-size: 0.7rem; padding: 0.2rem 0.5rem; border-radius: 4px;
      font-weight: 700; text-transform: uppercase;
    }
    .a-content {
      color: var(--color-text-secondary);
      font-size: 1rem; line-height: 1.6; white-space: pre-wrap;
    }

    .admin-controls {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(255, 255, 255,0.05);
    }
    .btn-icon {
      background: rgba(255, 255, 255,0.05);
      border: 1px solid var(--color-card-border);
      color: var(--color-text-secondary);
      width: 32px;
      height: 32px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .btn-icon:hover {
      background: rgba(255, 255, 255,0.1);
      color: var(--color-text-primary);
    }
    .btn-icon.delete:hover {
      background: #ef4444;
      color: #ffffff;
      border-color: #ef4444;
    }

    .loading-state, .empty-state {
      text-align: center; padding: 3rem; color: var(--color-text-secondary);
    }
    .empty-state i { font-size: 3rem; margin-bottom: 1rem; opacity: 0.5; }

    /* Modal Form */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-overlay.active { display: flex; }
    .modal-content {
      background: var(--color-card-dark);
      border: 1px solid var(--color-card-border);
      width: 100%;
      max-width: 500px;
      border-radius: 16px;
      padding: 2rem;
      position: relative;
    }
    .modal-close {
      position: absolute;
      top: 1rem; right: 1.5rem;
      background: none; border: none;
      color: var(--color-text-secondary);
      font-size: 1.5rem; cursor: pointer;
    }
    .modal-content h2 { margin-bottom: 1.5rem; }
    
    .form-group { margin-bottom: 1.2rem; text-align: left; }
    .form-group label {
      display: block; margin-bottom: 0.5rem;
      font-size: 0.9rem; color: var(--color-text-secondary);
    }
    .form-group input[type="text"], .form-group textarea {
      width: 100%; padding: 0.8rem 1rem;
      background: rgba(255, 255, 255,0.05);
      border: 1px solid var(--color-card-border);
      border-radius: 8px; color: var(--color-text-primary);
      outline: none; font-family: inherit;
    }
    .form-group textarea { min-height: 120px; resize: vertical; }
    
    .checkbox-group {
      display: flex; align-items: center; gap: 0.5rem;
      margin-top: 1rem; cursor: pointer; text-align: left;
    }
    .checkbox-group input { width: 18px; height: 18px; accent-color: var(--color-primary); }
    
    .btn-submit {
      width: 100%; padding: 1rem;
      background: var(--color-primary); color: var(--color-bg-dark);
      border: none; border-radius: 8px; font-weight: 700;
      margin-top: 1rem; cursor: pointer;
    }
    .btn-submit:hover { opacity: 0.9; }

  </style>

  <script src="js/supabase.js"></script>
</head>
<body>

  <header class="page-header">
    <a href="index.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i></a>
    <i class="fa-solid fa-tower-broadcast"></i>
    <h1>Live Announcements</h1>
    <p>Real-time updates directly from the mosque committee</p>
  </header>

  <div id="admin-action-bar">
    <button class="btn-add" onclick="openModal()"><i class="fa-solid fa-plus"></i> New Announcement</button>
  </div>

  <div class="announcements-container" id="user-announcements-list" style="margin-top: 1rem;">
    <div class="loading-state">
      <i class="fa-solid fa-circle-notch fa-spin"></i> Fetching latest updates...
    </div>
  </div>

  <!-- Modal for Add/Edit -->
  <div class="modal-overlay" id="announcement-modal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">&times;</button>
      <h2 id="modal-title">New Announcement</h2>
      
      <form id="announcement-form">
        <input type="hidden" id="form-id">
        <div class="form-group">
          <label>Title</label>
          <input type="text" id="form-title" required placeholder="e.g. Solat Jumaat Update">
        </div>
        <div class="form-group">
          <label>Content</label>
          <textarea id="form-content" required placeholder="Enter announcement details here..."></textarea>
        </div>
        <label class="checkbox-group">
          <input type="checkbox" id="form-pinned">
          <span style="color:var(--color-text-primary);">Pin to top (Highlight as important)</span>
        </label>
        
        <button type="submit" class="btn-submit" id="form-submit-btn">Publish Announcement</button>
      </form>
    </div>
  </div>

  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script> <!-- To get getLocalUser() -->
  <script>
    let allAnnouncements = [];
    let isAdmin = false;

    document.addEventListener('DOMContentLoaded', async () => {
      // Check user session
      const user = getLocalUser();
      if (user && user.is_admin) {
        isAdmin = true;
        document.getElementById('admin-action-bar').style.display = 'block';
      }

      await fetchAnnouncements();

      // Form submission
      document.getElementById('announcement-form').addEventListener('submit', handleFormSubmit);

      // Setup real-time subscription for live updates
      window.sb
        .channel('public:announcements')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'announcements' }, payload => {
          // Instead of silent reload, we can re-fetch
          fetchAnnouncements();
        })
        .subscribe();
    });

    async function fetchAnnouncements() {
      const container = document.getElementById('user-announcements-list');
      try {
        const { data, error } = await window.sb
          .from('announcements')
          .select('*')
          .order('is_pinned', { ascending: false })
          .order('created_at', { ascending: false });

        if (error) throw error;
        allAnnouncements = data || [];
        
        if (allAnnouncements.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <i class="fa-solid fa-bell-slash"></i>
              <h3>No Announcements</h3>
              <p>There are no live announcements at the moment. Check back later!</p>
            </div>
          `;
          return;
        }

        let html = '';
        allAnnouncements.forEach(a => {
          const dateObj = new Date(a.created_at);
          const dateStr = dateObj.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
          const timeStr = dateObj.toLocaleTimeString('en-US', { hour: 'numeric', minute:'2-digit', hour12: true });
          
          const isPinned = a.is_pinned;
          const pinnedHtml = isPinned ? `<span class="badge-pinned"><i class="fa-solid fa-thumbtack"></i> Pinned</span>` : '';
          
          let adminHtml = '';
          if (isAdmin) {
            adminHtml = `
              <div class="admin-controls">
                <button class="btn-icon" onclick="editAnnouncement('${a.id}')" title="Edit"><i class="fa-solid fa-pen"></i></button>
                <button class="btn-icon delete" onclick="deleteAnnouncement('${a.id}')" title="Delete"><i class="fa-solid fa-trash"></i></button>
              </div>
            `;
          }

          html += `
            <div class="a-card ${isPinned ? 'pinned' : ''}">
              <div class="a-header">
                <h3 class="a-title">${a.title} ${pinnedHtml}</h3>
                <span class="a-date">${dateStr} • ${timeStr}</span>
              </div>
              <div class="a-content">${a.content}</div>
              ${adminHtml}
            </div>
          `;
        });
        container.innerHTML = html;

      } catch (err) {
        console.error('Failed to load announcements:', err);
        container.innerHTML = `<div class="empty-state" style="color:#ef4444;">Failed to connect to the server.</div>`;
      }
    }

    // ── CRUD Helpers ───────────────────────────────────────────────
    function openModal() {
      document.getElementById('form-id').value = '';
      document.getElementById('form-title').value = '';
      document.getElementById('form-content').value = '';
      document.getElementById('form-pinned').checked = false;
      document.getElementById('modal-title').textContent = 'New Announcement';
      document.getElementById('announcement-modal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('announcement-modal').classList.remove('active');
    }

    function editAnnouncement(id) {
      const ann = allAnnouncements.find(a => a.id === id);
      if (!ann) return;
      
      document.getElementById('form-id').value = ann.id;
      document.getElementById('form-title').value = ann.title;
      document.getElementById('form-content').value = ann.content;
      document.getElementById('form-pinned').checked = ann.is_pinned;
      document.getElementById('modal-title').textContent = 'Edit Announcement';
      
      document.getElementById('announcement-modal').classList.add('active');
    }

    async function deleteAnnouncement(id) {
      if (!confirm('Are you sure you want to delete this announcement? This action cannot be undone.')) return;
      
      try {
        const { error } = await window.sb
          .from('announcements')
          .delete()
          .eq('id', id);
          
        if (error) throw error;
        fetchAnnouncements();
      } catch (err) {
        console.error('Delete error:', err);
        alert('Failed to delete: ' + err.message);
      }
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      
      const id = document.getElementById('form-id').value;
      const title = document.getElementById('form-title').value.trim();
      const content = document.getElementById('form-content').value.trim();
      const is_pinned = document.getElementById('form-pinned').checked;
      const btn = document.getElementById('form-submit-btn');

      if (!title || !content) return;

      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Saving...';
      btn.disabled = true;

      try {
        if (id) {
          // Update
          const { error } = await window.sb
            .from('announcements')
            .update({ title, content, is_pinned })
            .eq('id', id);
          if (error) throw error;
        } else {
          // Insert
          const { error } = await window.sb
            .from('announcements')
            .insert([{ title, content, is_pinned }]);
          if (error) throw error;
        }
        
        closeModal();
        fetchAnnouncements(); // Refresh list
        
      } catch (err) {
        console.error('Save error:', err);
        alert('Failed to save announcement: ' + err.message);
      } finally {
        btn.innerHTML = 'Publish Announcement';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>

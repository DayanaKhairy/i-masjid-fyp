<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Al-Quran | i@masjid</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1c1c1e;
      --card-hover: #2c2c2e;
      --text-primary: #ffffff;
      --text-secondary: #8e8e93;
      --accent: #ffffff;
      --border-color: #38383a;
      --circle-bg: #2c2c2e;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }

    /* Top Navigation (Floating Back) */
    .top-nav {
      position: sticky;
      top: 0;
      background: rgba(18, 18, 18, 0.9);
      backdrop-filter: blur(10px);
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 100;
      border-bottom: 1px solid var(--border-color);
    }
    .back-btn {
      color: var(--text-primary);
      text-decoration: none;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .header-title {
      font-family: 'Amiri', serif;
      font-size: 1.8rem;
    }

    /* Search Bar */
    .search-container {
      padding: 1rem 1.5rem;
      position: sticky;
      top: 60px; /* Below nav */
      background: var(--bg-color);
      z-index: 99;
    }
    .search-input-wrapper {
      position: relative;
      width: 100%;
    }
    .search-input-wrapper i {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
      font-size: 1rem;
    }
    .search-input {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 0.8rem 1rem 0.8rem 2.5rem;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-input:focus {
      border-color: var(--accent);
    }

    /* Surah List */
    .surah-list {
      max-width: 800px;
      margin: 0 auto;
      padding: 0.5rem 1rem 4rem 1rem;
    }

    .surah-item {
      display: flex;
      align-items: center;
      padding: 1rem;
      border-bottom: 1px solid var(--border-color);
      cursor: pointer;
      transition: background 0.2s;
      border-radius: 8px;
    }
    .surah-item:hover {
      background: var(--card-hover);
    }
    .surah-item:last-child {
      border-bottom: none;
    }

    .surah-number {
      width: 36px;
      height: 36px;
      background: var(--circle-bg);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-secondary);
      flex-shrink: 0;
      margin-right: 1rem;
    }

    .surah-info {
      flex: 1;
    }
    .surah-name-en {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.2rem;
    }
    .surah-meta {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .surah-name-ar {
      font-family: 'Amiri', serif;
      font-size: 1.8rem;
      color: var(--text-primary);
      margin-left: 1rem;
    }

    /* Reader View */
    #reader-view {
      display: none;
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .mushaf-page {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 2rem;
      margin-bottom: 2rem;
    }

    .surah-header-reader {
      text-align: center;
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border-color);
    }
    .surah-header-reader h2 {
      font-family: 'Amiri', serif;
      font-size: 2.5rem;
      color: var(--accent);
      margin-bottom: 0.5rem;
    }
    .surah-header-reader p {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .bismillah {
      text-align: center;
      font-family: 'Amiri', serif;
      font-size: 2.5rem;
      color: var(--text-primary);
      margin-bottom: 2.5rem;
    }

    .surah-content {
      font-family: 'Amiri', serif;
      font-size: 2.2rem;
      line-height: 2.4;
      text-align: justify;
      text-align-last: center;
      direction: rtl;
      color: var(--text-primary);
    }

    .verse-end {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path fill="none" stroke="%2310B981" stroke-width="4" d="M50 5 L85 25 L85 75 L50 95 L15 75 L15 25 Z"/></svg>') center/contain no-repeat;
      color: var(--accent);
      font-size: 1rem;
      margin: 0 0.5rem;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      vertical-align: middle;
    }

    /* Loader */
    .loader-container {
      text-align: center;
      padding: 4rem;
      color: var(--text-secondary);
    }
    .loader-container i {
      color: var(--accent);
      margin-bottom: 1rem;
    }

    @media (max-width: 600px) {
      .mushaf-page { padding: 1.5rem 1rem; }
      .surah-content { font-size: 1.8rem; line-height: 2.2; }
      .surah-name-ar { font-size: 1.5rem; }
      .bismillah { font-size: 2rem; }
      .verse-end { width: 30px; height: 30px; font-size: 0.8rem; }
    }
  </style>
</head>
<body>

  <!-- Main View -->
  <div id="main-view">
    <div class="top-nav">
      <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
      <div class="header-title">القرآن الكريم</div>
      <div style="width: 24px;"></div> <!-- Spacer for flex balance -->
    </div>

    <div class="search-container">
      <div class="search-input-wrapper">
        <i class="fa-solid fa-search"></i>
        <input type="text" id="search-box" class="search-input" placeholder="Search Surah...">
      </div>
    </div>

    <div class="surah-list" id="surah-list">
      <div class="loader-container">
        <i class="fa-solid fa-circle-notch fa-spin fa-2x"></i>
        <p>Loading Surahs...</p>
      </div>
    </div>
  </div>

  <!-- Reader View -->
  <div id="reader-view">
    <div class="top-nav" style="position: relative; margin: -2rem -1.5rem 2rem -1.5rem; border-bottom: none;">
      <button class="back-btn" style="background:none;border:none;cursor:pointer;" onclick="closeReader()">
        <i class="fa-solid fa-arrow-left"></i>
      </button>
      <div style="width: 24px;"></div>
    </div>

    <div id="reader-content"></div>
  </div>

  <script>
    const surahListContainer = document.getElementById('surah-list');
    const searchBox = document.getElementById('search-box');
    const mainView = document.getElementById('main-view');
    const readerView = document.getElementById('reader-view');
    const readerContent = document.getElementById('reader-content');

    let allSurahs = [];

    const arabicNums = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
    function toArabicNumeral(num) {
      return num.toString().split('').map(digit => arabicNums[digit]).join('');
    }

    // Load Surah Meta on startup
    async function loadSurahs() {
      try {
        const response = await fetch('https://api.alquran.cloud/v1/surah');
        const result = await response.json();
        
        if (result.code === 200) {
          allSurahs = result.data;
          renderList(allSurahs);
        }
      } catch (err) {
        surahListContainer.innerHTML = '<div class="loader-container"><p style="color:#ef4444;">Failed to load data. Check internet connection.</p></div>';
      }
    }

    function renderList(surahs) {
      if (surahs.length === 0) {
        surahListContainer.innerHTML = '<div class="loader-container"><p>No Surahs found.</p></div>';
        return;
      }

      const html = surahs.map(s => {
        // Strip out "Surah " from Arabic name for cleaner look if it exists, but API usually has "سُورَةُ ٱلْفَاتِحَةِ"
        let arName = s.name.replace('سُورَةُ ', '');
        
        return `
          <div class="surah-item" onclick="openSurah(${s.number}, '${s.englishName}', '${s.englishNameTranslation}')">
            <div class="surah-number">${s.number}</div>
            <div class="surah-info">
              <div class="surah-name-en">${s.englishName}</div>
              <div class="surah-meta">${s.englishNameTranslation} • ${s.numberOfAyahs} verses</div>
            </div>
            <div class="surah-name-ar">${arName}</div>
          </div>
        `;
      }).join('');

      surahListContainer.innerHTML = html;
    }

    // Search functionality
    searchBox.addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase();
      const filtered = allSurahs.filter(s => 
        s.englishName.toLowerCase().includes(query) || 
        s.englishNameTranslation.toLowerCase().includes(query)
      );
      renderList(filtered);
    });

    // Open a specific Surah
    async function openSurah(num, enName, enTrans) {
      mainView.style.display = 'none';
      readerView.style.display = 'block';
      window.scrollTo(0, 0);

      readerContent.innerHTML = `
        <div class="loader-container" style="margin-top: 5rem;">
          <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
          <p>Loading Surah ${enName}...</p>
        </div>
      `;

      try {
        const response = await fetch(`https://api.alquran.cloud/v1/surah/${num}/quran-uthmani`);
        const result = await response.json();
        
        if (result.code === 200) {
          renderReader(result.data, enName, enTrans);
        }
      } catch (err) {
        readerContent.innerHTML = '<div class="loader-container"><p style="color:#ef4444;">Failed to load verses.</p></div>';
      }
    }

    function renderReader(surahData, enName, enTrans) {
      const ayahs = surahData.ayahs;
      
      let html = '<div class="mushaf-page">';
      
      // Header
      html += `
        <div class="surah-header-reader">
          <h2>${surahData.name}</h2>
          <p>${enName} • ${enTrans}</p>
        </div>
      `;

      // Bismillah
      if (surahData.number !== 1 && surahData.number !== 9) {
        html += `<div class="bismillah">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>`;
      }

      html += `<div class="surah-content">`;

      ayahs.forEach(ayah => {
        let ayahText = ayah.text;
        
        // Remove Bismillah from text if it's there (API includes it in verse 1 sometimes)
        if (ayah.numberInSurah === 1 && surahData.number !== 1) {
           ayahText = ayahText.replace("بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ ", "");
           ayahText = ayahText.replace("بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ ", "");
        }

        html += `${ayahText} <span class="verse-end">${toArabicNumeral(ayah.numberInSurah)}</span> `;
      });

      html += `</div></div>`;
      readerContent.innerHTML = html;
    }

    function closeReader() {
      readerView.style.display = 'none';
      mainView.style.display = 'block';
      readerContent.innerHTML = '';
      window.scrollTo(0, 0);
    }

    // Initialize
    loadSurahs();
  </script>
</body>
</html>
